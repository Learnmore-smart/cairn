<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC85C"/>
      <stop offset="1" stop-color="#EE9A35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B9CFF"/>
      <stop offset="1" stop-color="#3E6BDE"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ED79C"/>
      <stop offset="1" stop-color="#1DAE77"/>
    </linearGradient>
  </defs>

  <!-- badge: fills the tile so the mark reads at 16px -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="none" stroke="#0D1420" stroke-opacity="0.14" stroke-width="1"/>

  <!-- cairn: fat stones, tight stack -->
  <rect x="7"    y="27.5" width="34"   height="10"  rx="4.5" fill="url(#green)"/>
  <rect x="10.5" y="18"   width="27"   height="8.5" rx="4"   fill="url(#blue)"/>
  <rect x="14"   y="8.5"  width="20"   height="8.5" rx="4"   fill="url(#amber)"/>
</svg>
