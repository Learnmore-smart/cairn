<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1420" stop-opacity="0.14"/>
      <stop offset="0.25" stop-color="#0D1420" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0D1420" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC85C"/>
      <stop offset="1" stop-color="#EE9A35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B9CFF"/>
      <stop offset="1" stop-color="#3E6BDE"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ED79C"/>
      <stop offset="1" stop-color="#1DAE77"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="112" y="112" width="800" height="800" rx="210" fill="url(#bg)"/>
  <rect x="113" y="113" width="798" height="798" rx="209" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="768" rx="330" ry="22" fill="#0D1420" opacity="0.22" filter="url(#soft)"/>

  <!-- cairn: bottom green / mid blue / top amber -->
  <rect x="216" y="621" width="592" height="136" rx="60" fill="url(#green)"/>
  <rect x="314" y="465" width="420" height="122" rx="54" fill="url(#blue)"/>
  <rect x="358" y="323" width="288" height="108" rx="48" fill="url(#amber)"/>

  <!-- stone top lights -->
  <rect x="226" y="631" width="572" height="10" rx="5" fill="#ffffff" opacity="0.22"/>
  <rect x="324" y="474" width="400" height="9" rx="4.5" fill="#ffffff" opacity="0.22"/>
  <rect x="367" y="331" width="270" height="8" rx="4" fill="#ffffff" opacity="0.24"/>
</svg>
